server:
    port: 9090
spring:
    application:
        name: STUDENTS_MANAGEMENT_SYSTEM
    datasource:
        driver-class-name:  com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://localhost:3306/studentss_details
        username: root
        password: root
    jpa: 
        hibernate.ddl-auto: update
        generate-ddl: true
        show-sql: true
eureka:
    client:
        register-with-eureka: true
        fetch-registry: true
        service-url:
         defaultZone: http://localhost:8761/eureka

    instance:
        hostname: localhost
