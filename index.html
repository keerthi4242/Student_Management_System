<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-dark">
  <div class="container-fluid">
     <div class="logo-title">
                   <img src="https://res.cloudinary.com/dziobx1hj/image/upload/v1781168390/smd_t4be1i.jpg" alt="Logo" class="logo">
                 <h1 class="heading">STUDENT MANAGEMENT DETAILS</h1>
                 </div>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="navbarNavDropdown">
      <ul class="navbar-nav">
        
        <li class="nav-item">
          <a class="nav-link" aria-current="page" href="#home">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#addstudent">AddStudent</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">About</a>
        </li>
         <li class="nav-item">
          <a class="nav-link" href="#">Contact</a>
        </li>
      </ul>
    </div>
  </div>

</nav>
<div class="container my-3" id="addForm" style="display:none;">

    <h3>Add Student</h3>

    <input id="id" placeholder="ID" class="form-control mb-2">
    <input id="name" placeholder="Name" class="form-control mb-2">
    <input id="branch" placeholder="Branch" class="form-control mb-2">
    <input id="email" placeholder="Email" class="form-control mb-2">
    <input id="contact" placeholder="Contact" class="form-control mb-2">
    <input id="cgpa" placeholder="CGPA" class="form-control mb-2">
    <input id="address" placeholder="Address" class="form-control mb-2">

    <button class="btn btn-success" onclick="addstudent()">
        Save Student
    </button>
    <button class="btn btn-secondary" onclick="clearForm()">
    Reset
</button>
    <button class="btn btn-secondary" onclick="updateStudent()">
    Update
</button>



</div>

<div class="student-card" id="home">

    <div class="tableheading">
        <h2 class="heading2">Students List</h2>

       <button id="addstudent" class="btn btn-primary my_button" onclick="document.getElementById('addForm').style.display='block'">
    + Add New Student
</button>
    </div>

    <table class="table table-hover">
        <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Branch</th>
                <th>Email</th>
                <th>Contact</th>
                <th>CGPA</th>
                <th>Address</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
        </tbody>
    </table>

</div>
<script>
           function addstudent(){
            const student={
                studId:document.getElementById("id").value,
                studName:document.getElementById("name").value,
                studBranch:document.getElementById("branch").value,
                studEmail:document.getElementById("email").value,
                studContact:document.getElementById("contact").value,
                studGpa:document.getElementById("cgpa").value,
                studAdd:document.getElementById("address").value
        
            };
            fetch("http://localhost:9090/students/add",{
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(student)
            })
             .then(res => res.json())
            .then(data => {
                alert("Student added successfully!");
                 document.getElementById("addForm").style.display = "none";
                    clearForm();
                   loadstudents();
            })
            .catch(err => console.log(err));
           } 
           function loadstudents(){
            fetch("http://localhost:9090/students/get")
            .then(res =>res.json())
            .then(data=>{
                 let tableData="";
                 data.forEach(student=>{
                    tableData += `
                    <tr>
                         <td>${student.studId}</td>
                          <td>${student.studName}</td> 
                          <td>${student.studBranch}</td> 
                          <td>${student.studEmail}</td> 
                          <td>${student.studContact}</td>
                          <td>${student.studGpa}</td>
                          <td>${student.studAdd}</td> 
                            <td> <button class="btn btn-warning btn-sm" onclick="editStudent(${student.studId})">Edit</button>
                                 <button class="btn btn-danger btn-sm" onclick="deleteStudent(${student.studId})"> Delete </button>
                                </td> 
                            </tr>`
                            ;
                 } );
                 document.querySelector("tbody").innerHTML = tableData; }) 
                 .catch(err => console.log(err)); }
                 loadstudents();
                 function clearForm() {
    document.getElementById("id").value = "";
    document.getElementById("id").readOnly = false;
    document.getElementById("name").value = "";
    document.getElementById("branch").value = "";
    document.getElementById("email").value = "";
    document.getElementById("contact").value = "";
    document.getElementById("cgpa").value = "";
    document.getElementById("address").value = "";
}
     function deleteStudent(id){
        if(!confirm("Are you sure you want to delete this student?")){
            return;
        }
        fetch(`http://localhost:9090/students/delete/${id}`,{
            method:"DELETE"
        })
        .then(res=>res.text())
        .then(data=>{
            alert(data);
            loadstudents();
        })
               .catch(err => console.log(err));
     }
     function editStudent(id){
        fetch(`http://localhost:9090/students/get/${id}`)
        .then(res=>res.json())
        .then(student=>{

        document.getElementById("addForm").style.display = "block";

        document.getElementById("id").value = student.studId;
        document.getElementById("id").readOnly = true;
        document.getElementById("name").value = student.studName;
        document.getElementById("branch").value = student.studBranch;
        document.getElementById("email").value = student.studEmail;
        document.getElementById("contact").value = student.studContact;
        document.getElementById("cgpa").value = student.studGpa;
        document.getElementById("address").value = student.studAdd;
    });
        
     }
     function updateStudent(){
        const student={
                studId:document.getElementById("id").value,
                studName:document.getElementById("name").value,
                studBranch:document.getElementById("branch").value,
                studEmail:document.getElementById("email").value,
                studContact:document.getElementById("contact").value,
                studGpa:document.getElementById("cgpa").value,
                studAdd:document.getElementById("address").value
        
            };
            fetch("http://localhost:9090/students/update",{
                method: "PUT",
                headers:{
                    "Content-type": "application/json"
                },body: JSON.stringify(student)
            })

            .then(res => res.json())
            .then(data => {
                alert("Student updated successfully!");
                    clearForm();
                   loadstudents();
            })
            .catch(err => console.log(err));
     }
           
    

</script>

</body>

</html>
